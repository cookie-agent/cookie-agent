## Cookie Agent's configuration: ~/.cookie-agent/config.toml.
##
## Every setting is optional; a commented line shows a setting and an example
## value. Uncomment and edit what you want to change. The full reference is
## https://cookie-agent.github.io/doc/dev/engine/configuration/
##
## Lines starting with `##` are notes; lines starting with `# ` are settings.

## The models agents reach as ${default_model} and ${small_model}: a model key
## ("provider/model", its default variant) or { model, variant }. These two
## must come before the first [table]. `cookie onboard` sets both.
# default_model = { model = "anthropic/claude-opus-4-1", variant = "high" }
# small_model = "deepseek/deepseek-chat"

## Where the daemon listens, and the token clients present. Changing it needs
## a daemon restart.
# [server]
# host = "127.0.0.1"
# port = 7419

## Size limits of memory notes and of the memory snapshot a session sees.
# [memory]
# user_max_bytes = 16384
# project_max_bytes = 16384
# snapshot_user_bytes = 12288

## Scheduled prompts: whether the daemon fires them, and how many fires each
## job remembers.
# [cron]
# enabled = true
# max_consecutive_failures = 3
# history = 20

## An MCP server every session can use. Agents ask before each MCP call unless
## their `mcp` rules say otherwise.
# [mcp.servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# timeout_ms = 30000
