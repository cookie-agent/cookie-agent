site_name: cookie agent
site_url: https://cookie-agent.github.io/doc/
site_description: Documentation for the cookie agent coding harness
repo_url: https://github.com/cookie-agent/cookie-agent
repo_name: cookie-agent/cookie-agent
docs_dir: docs/site
site_dir: site
exclude_docs: |
  api/**/*.md
strict: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Guide:
      - Installation: install.md
      - Run: guide/run.md
      - Sessions: guide/sessions.md
      - Compaction: guide/compaction.md
      - Goal Mode: guide/goals.md
      - Usage and Cost: guide/usage.md
  - Engine Configuration:
      - Agent: guide/agents.md
      - Skill: guide/skills.md
      - config.toml: guide/configuration.md
      - 'Server [server]': engine/server.md
      - 'Tool Output [tool_output]': engine/tool_output.md
      - 'AGENTS.md Context [agent_md]': engine/agent_md.md
      - 'Approval [approval]': engine/approval.md
      - 'Model Retry [model_retry]': engine/model_retry.md
      - 'Context Compaction [context_compaction]': engine/context_compaction.md
      - 'Session Title [session_title]': engine/session_title.md
      - 'Delegation [delegation]': engine/delegation.md
      - 'Request Header [headers]': engine/headers.md
      - 'Providers [providers]': guide/providers.md
      - 'MCP [mcp]': guide/mcp.md
      - 'Plugins [plugins]': guide/plugins.md
  - TUI Configuration:
      - tui.toml: tui/configuration.md
      - 'Minimum Event Level [minimum_event_level]': tui/minimum_event_level.md
      - 'Theme [theme]': tui/theme.md
  - Development:
      - Architecture: architecture.md
      - Building and testing: development/building.md
      - Plugin development: development/plugins.md
      - Rust API: reference/api.md
  - Specs:
      - Status and scope: specs/index.md
      - Tool output streams: specs/tool-output-streams.md
      - Agent messaging: specs/agent-messaging.md
      - Model configuration: specs/model-configuration.md
      - Documentation overhaul: specs/documentation-overhaul.md
      - Goal mode and producers: development/goal-mode.md
      - System prompt: reference/system-prompt.md
      - Protocol: reference/protocol.md
      - Events: reference/events.md
      - Tools: reference/tools.md
      - Schemas: reference/schemas.md
      - Security boundaries: guide/security.md

extra:
  version:
    provider: mike
