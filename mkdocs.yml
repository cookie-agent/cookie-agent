site_name: Cookie Agent
site_url: https://cookie-agent.github.io/doc/
site_description: Documentation for the Cookie Agent coding harness
repo_url: https://github.com/cookie-agent/cookie-agent
repo_name: cookie-agent/cookie-agent
docs_dir: docs/site
site_dir: site
exclude_docs: |
  api/**/*.md
strict: true
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Instrument Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/cookie.css

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

