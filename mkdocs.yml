site_name: cookie agent
site_url: https://cookie-agent.github.io/cookie-agent/
site_description: Documentation for the cookie agent coding harness
repo_url: https://github.com/cookie-agent/cookie-agent
repo_name: cookie-agent/cookie-agent
docs_dir: docs/site
site_dir: site
exclude_docs: |
  api/**/*.md
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: install.md
  - Guide:
      - TUI: guide/tui.md
      - Headless runs: guide/headless.md
      - Sessions: guide/sessions.md
      - Permissions: guide/permissions.md
      - Security guarantees: guide/security.md
      - MCP servers: guide/mcp.md
      - Plugins: guide/plugins.md
      - Agents: guide/agents.md
      - Skills: guide/skills.md
      - Configuration: guide/configuration.md
      - Providers: guide/providers.md
      - Compaction: guide/compaction.md
      - Usage and cost: guide/usage.md
  - Reference:
      - Configuration: reference/configuration.md
      - System prompt: reference/system-prompt.md
      - Protocol: reference/protocol.md
      - Events: reference/events.md
      - Tools: reference/tools.md
      - Schemas: reference/schemas.md
      - Rust API: reference/api.md
  - Architecture: architecture.md

extra:
  version:
    provider: mike
