# Checked schema-6 provider fixture. Export COOKIE_TEST_API_KEY before startup.
schema_version = 6

[server]
host = "127.0.0.1"
port = 17419

[providers.anthropic]
source = "explicit"
endpoint = "https://llm-api.quantumcookie.xyz/v1"
adaptor = "anthropic"
auth = { type = "api_key", key = "${env:COOKIE_TEST_API_KEY}" }

[providers.anthropic.models."kimi-for-coding"]
display_name = "Kimi for Coding (Anthropic wire)"
default_variant = "high"
defaults = { max_output_tokens = 16384 }

[providers.anthropic.models."kimi-for-coding".capabilities]
input = ["text", "image", "pdf"]
output = ["text"]
context_tokens = 262144
output_tokens = 32768
tool_calling = true
parallel_tool_calls = true
structured_output = false
reasoning = true
temperature = true
top_p = true
seed = false
native_replay = "optional"
native_compaction = "unsupported"
cancellation = "local_only"

[providers.anthropic.models."kimi-for-coding".capabilities.media.image]
mime_types = ["image/jpeg", "image/png", "image/gif", "image/webp"]
max_bytes = 20971520
max_count = 20

[providers.anthropic.models."kimi-for-coding".capabilities.media.pdf]
mime_types = ["application/pdf"]
max_bytes = 20971520
max_count = 10

[providers.anthropic.models."kimi-for-coding".variants.high]
operation = "add"
reasoning = { type = "effort", value = "high" }

[providers.openai]
source = "explicit"
endpoint = "https://llm-api.quantumcookie.xyz/v1"
adaptor = "openai-responses"
auth = { type = "bearer", token = "${env:COOKIE_TEST_API_KEY}" }

[providers.openai.models."gpt-5.6-luna"]
display_name = "GPT 5.6 Luna (Responses)"
default_variant = "high"
defaults = { max_output_tokens = 16384 }

[providers.openai.models."gpt-5.6-luna".capabilities]
input = ["text", "image", "pdf"]
output = ["text"]
context_tokens = 262144
output_tokens = 32768
tool_calling = true
parallel_tool_calls = true
structured_output = true
reasoning = true
temperature = false
top_p = false
seed = false
native_replay = "required"
native_compaction = "unsupported"
cancellation = "local_only"

[providers.openai.models."gpt-5.6-luna".capabilities.media.image]
mime_types = ["image/jpeg", "image/png", "image/gif", "image/webp"]
max_bytes = 20971520
max_count = 20

[providers.openai.models."gpt-5.6-luna".capabilities.media.pdf]
mime_types = ["application/pdf"]
max_bytes = 20971520
max_count = 10

[providers.openai.models."gpt-5.6-luna".variants.high]
operation = "add"
reasoning = { type = "effort", value = "high" }

[providers."quantumcookie.gateway"]
source = "explicit"
endpoint = "https://llm-api.quantumcookie.xyz/v1"
adaptor = "openai-compatible"
auth = { type = "bearer", token = "${env:COOKIE_TEST_API_KEY}" }

[providers."quantumcookie.gateway".models."deepseek-v4-flash"]
display_name = "DeepSeek V4 Flash"
defaults = { max_output_tokens = 16384 }

[providers."quantumcookie.gateway".models."deepseek-v4-flash".capabilities]
input = ["text"]
output = ["text"]
context_tokens = 262144
output_tokens = 32768
tool_calling = true
parallel_tool_calls = false
structured_output = false
reasoning = false
temperature = true
top_p = true
seed = true
native_replay = "unsupported"
native_compaction = "unsupported"
cancellation = "local_only"
media = {}
