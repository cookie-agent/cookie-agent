[workspace]
members = [
    "crates/protocol",
    "crates/providers",
    "crates/engine",
    "crates/tools",
    "crates/config",
    "crates/server",
    "crates/tui",
    "crates/cookie_agent",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
async-openai = "0.41.2"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["macros", "ws"] }
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
eventsource-stream = "0.2.3"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = "0.3.33"
ignore = "0.4.31"
jiff = { version = "0.2.35", features = ["serde"] }
process-wrap = { version = "9.1.0", features = ["tokio1"] }
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
schemars = { version = "1.2.2", features = ["derive", "uuid1", "jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.1.1"
thiserror = "2.0.19"
toml = "0.8.23"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs", "io-util", "net"] }
tokio-util = "0.7.19"
tokio-tungstenite = "0.29"
tower-http = { version = "0.7.0", features = ["cors", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tree-sitter-bash = "0.25.1"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "jiff-impl", "serde-json-impl"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
insta = { version = "1.48.0", features = ["json", "redactions"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
