[workspace]
members = [
    "crates/identity",
    "crates/protocol",
    "crates/engine",
    "crates/tools",
    "crates/config",
    "crates/models",
    "crates/server",
    "crates/tui",
    "crates/cookie_agent",
]
exclude = ["vendor/syntect"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.8.2"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["macros", "ws"] }
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
crc32fast = "1.5.0"
flate2 = "1.1.9"
futures-util = "0.3.33"
indexmap = { version = "2.12.1", features = ["serde"] }
jiff = { version = "0.2.35", features = ["serde"] }
libc = "0.2.189"
process-wrap = { version = "9.1.0", features = ["tokio1"] }
pulldown-cmark = "=0.13.4"
ratatui = "0.30.2"
rustix = { version = "1.1.2", features = ["fs", "process"] }
schemars = { version = "1.2.2", features = ["derive", "uuid1", "jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
similar = "3.1.1"
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
thiserror = "2.0.19"
toml = "0.8.23"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs", "io-util", "net"] }
tokio-util = "0.7.19"
tokio-tungstenite = "0.29"
tower-http = { version = "0.7.0", features = ["cors", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl", "jiff-impl", "serde-json-impl"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
zeroize = "1.8"
insta = { version = "1.48.0", features = ["json", "redactions"] }
tempfile = "3.27.0"
http = "1.4.0"
url = "2.5.7"
oven-sdk = "=0.5.0"
oven-sdk-anthropic = "=0.6.0"
oven-sdk-openai = "=0.5.0"
oven-sdk-google = "=0.5.0"
oven-sdk-google-vertex = "=0.5.0"
oven-sdk-bedrock = "=0.4.0"
oven-sdk-azure = "=0.4.0"
oven-sdk-cohere = "=0.3.0"
oven-sdk-open-responses = "=0.3.0"
reqwest-oven = { package = "reqwest", version = "=0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }

[patch.crates-io]
syntect = { path = "vendor/syntect" }
