[workspace]
members = [
    "crates/identity",
    "crates/protocol",
    "crates/protocol_transport",
    "crates/client_state",
    "crates/plugin_sdk",
    "crates/runtime_api",
    "crates/mcp",
    "crates/engine_store",
    "crates/engine",
    "crates/coding_runtime",
    "crates/config",
    "crates/models",
    "crates/server",
    "crates/tui",
    "crates/web",
    "crates/web_assets",
    "crates/cookie_agent",
]
resolver = "2"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/cookie-agent/cookie-agent"
rust-version = "1.88"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.8.2"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["macros", "ws"] }
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
crc32fast = "1.5.0"
flate2 = "1.1.9"
foldhash = "0.2.0"
fs2 = "0.4.3"
futures-util = "0.3.33"
getrandom = "0.2.17"
indexmap = { version = "2.12.1", features = ["serde"] }
jiff = { version = "0.2.35", features = ["serde"] }
libc = "0.2.189"
process-wrap = { version = "9.1.0", features = ["tokio1"] }
pulldown-cmark = "=0.13.5"
ratatui = "0.30.2"
rustix = { version = "1.1.2", features = ["fs", "process"] }
schemars = { version = "1.2.2", features = ["derive", "uuid1", "jiff02"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
thiserror = "2.0.19"
toml = "0.8.23"
toml_edit = "0.22.27"
unicode-properties = { version = "0.1.4", default-features = false, features = ["emoji"] }
unicode-segmentation = "1.13.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs", "io-util", "io-std", "net"] }
tokio-util = "0.7.19"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
zeroize = "1.8"
insta = { version = "1.48.0", features = ["json", "redactions"] }
tempfile = "3.27.0"
http = "1.4.0"
# The web client's icons: Font Awesome Free (CC BY 4.0 artwork) as inline SVG.
icondata = { version = "=0.7.0", default-features = false, features = ["font-awesome"] }
leptos_icons = "=0.7.1"
url = "2.5.7"
windows-sys = "0.61.2"
oven-sdk = { version = "=0.9.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
oven-sdk-anthropic = { version = "=0.10.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
oven-sdk-openai = { version = "=0.9.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
oven-sdk-google = { version = "=0.9.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
oven-sdk-google-vertex = { version = "=0.9.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
oven-sdk-bedrock = { version = "=0.8.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
oven-sdk-azure = { version = "=0.8.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
oven-sdk-cohere = { version = "=0.7.0", git = "https://github.com/cookie-agent/oven-sdk.git", rev = "61361b4448a98780f7c4f572c05542f4ed49b165" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "client-side-sse"] }

[profile.dev]
debug = "line-tables-only"

# Thin LTO recovers most of fat LTO's cross-crate inlining (serde-heavy
# provider and protocol code) at a fraction of its link time.
[profile.release]
strip = true
lto = "thin"

# Shipped binaries: fat LTO with one codegen unit trades a much slower final
# link for the smallest binary. `panic` stays `unwind` because the engine and
# TUI recover from panics with `catch_unwind`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The web client (scripts/build-web.sh): smallest code over speed, as the
# browser downloads it.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# `scripts/build-web.sh --fast`: the web client for local browser runs,
# built in a fraction of `web`'s time. CI and releases ship `web`.
[profile.web-dev]
inherits = "web"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
