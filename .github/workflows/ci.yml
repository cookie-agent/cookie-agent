name: CI

on:
  # Branch pushes only: a stable release starts from a GitHub release being
  # published, so the tag it creates must not start a second run.
  #
  # Documentation-only changes skip this workflow; the Documentation
  # workflow builds the site. Changes to the pages that tests keep in step
  # with the code still run it. Later patterns override earlier ones.
  push:
    branches: ['**']
    paths: &code-paths
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!mkdocs.yml'
      - 'docs/site/clients/cli.md'
      - 'docs/site/reference/errors.md'
      - 'docs/site/reference/protocol.md'
      - 'docs/site/reference/tools.md'
  pull_request:
    paths: *code-paths
  release:
    types: [published]
  # The nightly: at most one prerelease a day, from main's head once this
  # run passed every check (see the `nightly` and `release` jobs and
  # RELEASING.md). Pushes to main run the checks but publish nothing. A
  # manual dispatch on main publishes the same way, outside the schedule.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Caches: every job reads main's, only runs on main write them, so branches
# and pull requests do not fill the shared 10 GB with copies of their own.
# Jobs keep separate caches: stable's tests build with RUSTFLAGS that no
# other job uses, so it shares no build with the web job's daemon build, and
# a shared key would leave whichever job saved second without its own.

# A newer push to a branch other than main, or to a pull request, stops the
# run it supersedes. Runs on main, scheduled and dispatched ones included,
# and stable releases each get a group of their own and always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest@0.9.145
      # Profiles in .config/nextest.toml; nextest does not run doctests.
      # The tests' files go to tmpfs, so their many small writes and fsyncs
      # never wait on the runner's disk. The run includes release_integrity,
      # which enforces release metadata and provenance.
      - run: cargo nextest run --workspace --locked --no-fail-fast --profile ci
        env:
          RUSTFLAGS: -D warnings
          TMPDIR: /dev/shm
      - run: cargo test --doc --workspace --locked
        env:
          RUSTFLAGS: -D warnings
          TMPDIR: /dev/shm
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check the protocol compatibility baselines
        run: crates/protocol/scripts/check-schema-additive.sh
      - name: Check the reference plugin's messages against the plugin protocol schemas
        run: python3 examples/plugins/python/check_reference_plugin.py
      # The shipped binary's secret scan runs in release.yml, on the
      # x86_64 Linux archive the release publishes, before anything is
      # published.
      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock --deny yanked
      - name: Enforce advisory, license, and source policy
        run: cargo deny --locked check advisories licenses sources
      - name: Check the third-party notices are current
        run: python3 scripts/third-party-notices.py --check

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

  wasm:
    name: Protocol client and client state on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --target wasm32-unknown-unknown -p cookie_agent_protocol -p cookie_agent_protocol_transport -p cookie_agent_client_state
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p cookie_agent_protocol -p cookie_agent_protocol_transport --features cookie_agent_protocol_transport/websocket -p cookie_agent_client_state --all-targets -- -D warnings

  web:
    name: Web client bundle and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # trunk, and wasm-bindgen-test-runner of the wasm-bindgen in
      # Cargo.lock for the protocol client's browser tests.
      - name: Install trunk and wasm-bindgen
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: trunk@0.21.14,wasm-bindgen@0.2.126
      # Trunk downloads the pinned wasm-bindgen, wasm-opt, and Tailwind CLIs
      # here on first use.
      - name: Cache Trunk's tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('crates/web/Trunk.toml') }}
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p cookie_agent_web --all-targets -- -D warnings
      - name: Build the bundle and report its size
        run: |
          scripts/build-web.sh | tee build-web.txt
          {
            echo '### Web bundle'
            echo '```'
            sed -n '/^web bundle in /,$p' build-web.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The runner's Google Chrome and its chromedriver ($CHROMEWEBDRIVER),
      # which scripts/web-e2e/chrome.sh finds.
      - name: Show the browser
        run: |
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
      - name: Protocol client in the browser
        run: scripts/test-wasm-client.sh
      - name: Browser scenarios against the embedded page
        run: SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" scripts/test-web-page.sh
      - name: Keep the scenario screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  windows:
    name: Windows MSVC (x86_64)
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-nextest@0.9.145
      # The test build on its own, so the warm-up below lands between it and
      # the tests, which then find everything built.
      - name: Build tests
        run: cargo nextest run --workspace --locked --no-run
        timeout-minutes: 60
      # On a fresh runner the first launch of Git Bash and Python
      # can take from seconds to over a minute (cold image disk, on-access
      # scanning), and std serializes process creation, so one cold launch
      # stalls every other spawn in the test process. Without this step that
      # one-time cost lands inside the liveness bounds of the coding runtime's
      # bash, corpus and MCP tests, the first that spawn these tools. It runs
      # after the build so the build cannot evict what it warmed, and its
      # timings show what was paid here.
      - name: Warm up Git Bash and Python
        shell: pwsh
        run: |
          $bash = (Get-Command bash -All -CommandType Application | Where-Object { $_.Source -notlike "$env:SystemRoot\System32\*" } | Select-Object -First 1).Source
          $time = Measure-Command { & $bash -c 'cat --version >/dev/null' | Out-Host }
          "Git Bash ($bash): {0:N1}s" -f $time.TotalSeconds
          $time = Measure-Command { python -c "import base64, json, os, sys, threading, time" | Out-Host }
          "Python: {0:N1}s" -f $time.TotalSeconds
      # The tests' files go to the runner's local temporary disk (D:, with
      # the workspace), not to the profile's temporary folder on C:.
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast --profile ci
        timeout-minutes: 60
        env:
          RUST_BACKTRACE: 1
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - name: Run doctests
        run: cargo test --doc --workspace --locked
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}

  # Pull requests only: on main the release's dist builds compile every
  # target, so a target that breaks fails the release before it publishes.
  # No cache: pull requests are rare here, and seven target caches would
  # crowd the shared 10 GB out of the jobs that run on every push.
  release-targets:
    name: Release target check (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Install musl build tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo check --locked --target ${{ matrix.target }} -p cookie_agent
        env:
          RUSTFLAGS: -D warnings

  # Whether the scheduled or dispatched run publishes a nightly: only when
  # main's head is not already the newest nightly's commit. The schedule
  # fires once a day, so at most one nightly a day publishes on its own.
  nightly:
    name: Nightly due
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - id: due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nightly tags as nightly-prune.yml matches them; the releases API
          # lists the newest first.
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq \
            '[.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-alpha\\.[0-9]+$"))][0].tag_name // empty')
          commit=
          if [[ -n "$last" ]]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$last" --jq .sha)
          fi
          if [[ "$commit" == "$GITHUB_SHA" ]]; then
            echo "::notice::No nightly: $last already publishes ${GITHUB_SHA:0:9}."
            echo due=false >> "$GITHUB_OUTPUT"
          else
            echo "Newest nightly: ${last:-none} (${commit:0:9}); main is at ${GITHUB_SHA:0:9}."
            echo due=true >> "$GITHUB_OUTPUT"
          fi

  # A stable release, or the day's nightly, once every check passed for
  # this commit.
  release:
    name: Release validated commit
    needs: [stable, msrv, wasm, web, windows, nightly]
    if: >-
      !cancelled()
      && needs.stable.result == 'success' && needs.msrv.result == 'success'
      && needs.wasm.result == 'success' && needs.web.result == 'success'
      && needs.windows.result == 'success'
      && (github.event_name == 'release' || needs.nightly.outputs.due == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
