name: CI

on:
  push:
  pull_request:

jobs:
  stable:
    name: Rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Enforce release metadata and provenance
        run: cargo test --locked -p cookie_agent_models --test release_integrity
      - name: Build locked release workspace
        run: cargo build --release --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: Scan locked release binary
        run: cargo test --locked -p cookie_agent_models --test release_integrity release_binary_contains_no_secret_material -- --ignored --exact
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked cargo-audit --version '=0.22.2'
          cargo install --locked cargo-deny --version '=0.20.2'
          cargo audit --version | grep '0.22.2'
          cargo deny --version | grep '0.20.2'
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock --deny yanked
      - name: Enforce advisory, license, and source policy
        run: cargo deny --locked check advisories licenses sources

  rust-1-88:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked -p cookie_agent_models --test release_integrity
      - run: cargo build --release --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --locked -p cookie_agent_models --test release_integrity release_binary_contains_no_secret_material -- --ignored --exact
