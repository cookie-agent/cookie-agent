name: CI

on:
  push:
  pull_request:

jobs:
  stable:
    name: Rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check generated bindings and additive event schema
        run: crates/protocol/scripts/check-bindings.sh --check
      - run: cargo test --locked --workspace
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Enforce release metadata and provenance
        run: cargo test --locked -p cookie_agent_models --test release_integrity
      - name: Build locked release workspace
        run: cargo build --release --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: Scan locked release binary
        run: cargo test --locked -p cookie_agent_models --test release_integrity release_binary_contains_no_secret_material -- --ignored --exact
      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked cargo-audit --version '=0.22.2'
          cargo install --locked cargo-deny --version '=0.20.2'
          cargo audit --version | grep '0.22.2'
          cargo deny --version | grep '0.20.2'
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock --deny yanked
      - name: Enforce advisory, license, and source policy
        run: cargo deny --locked check advisories licenses sources

  rust-1-88:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo check --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked -p cookie_agent_models --test release_integrity
      - run: cargo build --release --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --locked -p cookie_agent_models --test release_integrity release_binary_contains_no_secret_material -- --ignored --exact

  windows:
    name: Windows MSVC (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: clippy
      - run: cargo check --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  release-targets:
    name: Release target check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: runner.os == 'Windows'
        with:
          toolchain: 1.88.0
      - name: Install Rust 1.88.0 with retries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          toolchain=1.88.0
          target='${{ matrix.target }}'
          CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

          for attempt in 1 2 3; do
            echo "Installing Rust $toolchain for $target (attempt $attempt/3)"
            install_ok=true
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
                https://sh.rustup.rs \
                | sh -s -- --default-toolchain none --no-modify-path -y \
                || install_ok=false
            fi
            if [[ "$install_ok" == true ]] \
              && RUSTUP_PERMIT_COPY_RENAME=1 rustup toolchain install "$toolchain" \
                --target "$target" --profile minimal --no-self-update \
              && rustup default "$toolchain"; then
              rustc --version --verbose
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Failed to install Rust $toolchain for $target after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Install musl build tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo check --locked --target ${{ matrix.target }} -p cookie_agent
        env:
          RUSTFLAGS: -D warnings
