name: CI

on:
  # Branch pushes only: a stable release starts from a GitHub release being
  # published, so the tag it creates must not start a second run.
  #
  # Documentation-only changes skip this workflow; the Documentation
  # workflow builds the site. Changes to the pages that tests keep in step
  # with the code still run it. Later patterns override earlier ones.
  push:
    branches: ['**']
    paths: &code-paths
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!mkdocs.yml'
      - 'docs/site/clients/cli.md'
      - 'docs/site/reference/errors.md'
      - 'docs/site/reference/protocol.md'
      - 'docs/site/reference/tools.md'
  pull_request:
    paths: *code-paths
  release:
    types: [published]

permissions:
  contents: read

jobs:
  stable:
    name: Rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
        env:
          RUSTFLAGS: -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check the protocol compatibility baselines
        run: crates/protocol/scripts/check-schema-additive.sh
      - name: Check the reference plugin's messages against the plugin protocol schemas
        run: python3 examples/plugins/python/check_reference_plugin.py
      - name: Enforce release metadata and provenance
        run: cargo test --locked -p cookie_agent_models --test release_integrity
      - name: Build the locked release binary
        run: cargo build --release --locked -p cookie_agent
      - name: Scan locked release binary
        run: cargo test --locked -p cookie_agent_models --test release_integrity release_binary_contains_no_secret_material -- --ignored --exact
      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Audit dependencies
        run: cargo audit --file Cargo.lock --deny yanked
      - name: Enforce advisory, license, and source policy
        run: cargo deny --locked check advisories licenses sources

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings

  wasm:
    name: Protocol client and client state on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --target wasm32-unknown-unknown -p cookie_agent_protocol -p cookie_agent_client_state
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p cookie_agent_protocol --features websocket -p cookie_agent_client_state --all-targets -- -D warnings

  web:
    name: Web client bundle and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # trunk, and wasm-bindgen-test-runner of the wasm-bindgen in
      # Cargo.lock for the protocol client's browser tests.
      - name: Install trunk and wasm-bindgen
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: trunk@0.21.14,wasm-bindgen@0.2.126
      # Trunk downloads the pinned wasm-bindgen, wasm-opt, and Tailwind CLIs
      # here on first use.
      - name: Cache Trunk's tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('crates/web/Trunk.toml') }}
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p cookie_agent_web --all-targets -- -D warnings
      - name: Build the bundle and report its size
        run: |
          scripts/build-web.sh | tee build-web.txt
          {
            echo '### Web bundle'
            echo '```'
            sed -n '/^web bundle in /,$p' build-web.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: "157.0.1"
      - name: Install geckodriver
        run: |
          curl -fsSL -o geckodriver.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          echo "e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  geckodriver.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf geckodriver.tar.gz -C "$RUNNER_TEMP/bin"
          echo "GECKODRIVER=$RUNNER_TEMP/bin/geckodriver" >> "$GITHUB_ENV"
      - name: Protocol client in the browser
        run: scripts/test-wasm-client.sh
      - name: Browser scenarios against the embedded page
        run: SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" scripts/test-web-page.sh
      - name: Keep the scenario screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  windows:
    name: Windows MSVC (x86_64)
    timeout-minutes: 90
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build tests
        run: cargo test --locked --workspace --no-run
        timeout-minutes: 60
      # On a fresh runner the first launch of Git Bash and Python
      # can take from seconds to over a minute (cold image disk, on-access
      # scanning), and std serializes process creation, so one cold launch
      # stalls every other spawn in the test process. Without this step that
      # one-time cost lands inside the liveness bounds of the coding runtime's
      # bash, corpus and MCP tests, the first that spawn these tools. It runs
      # after the build so the build cannot evict what it warmed, and its
      # timings show what was paid here.
      - name: Warm up Git Bash and Python
        shell: pwsh
        run: |
          $bash = (Get-Command bash -All -CommandType Application | Where-Object { $_.Source -notlike "$env:SystemRoot\System32\*" } | Select-Object -First 1).Source
          $time = Measure-Command { & $bash -c 'cat --version >/dev/null' | Out-Host }
          "Git Bash ($bash): {0:N1}s" -f $time.TotalSeconds
          $time = Measure-Command { python -c "import base64, json, os, sys, threading, time" | Out-Host }
          "Python: {0:N1}s" -f $time.TotalSeconds
      - name: Run tests
        run: cargo test --locked --workspace --no-fail-fast -- --nocapture
        timeout-minutes: 60
        env:
          RUST_BACKTRACE: 1

  release-targets:
    name: Release target check (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install musl build tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo check --locked --target ${{ matrix.target }} -p cookie_agent
        env:
          RUSTFLAGS: -D warnings

  release:
    name: Release validated commit
    needs: [stable, msrv, wasm, web, windows, release-targets]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
