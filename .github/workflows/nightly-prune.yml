name: Prune nightly releases

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete expired nightly prereleases
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '14 days ago' +%s)"
          releases_file="$(mktemp)"
          trap 'rm -f "$releases_file"' EXIT

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, .created_at] | @tsv' > "$releases_file"

          mapfile -t nightlies < <(
            while IFS=$'\t' read -r tag created_at; do
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || continue
              if created_epoch="$(date -u -d "$created_at" +%s)"; then
                printf '%s\t%s\n' "$created_epoch" "$tag"
              else
                printf 'Skipping %s: invalid created_at %s\n' "$tag" "$created_at" >&2
              fi
            done < "$releases_file" |
              sort -nr
          )

          for index in "${!nightlies[@]}"; do
            IFS=$'\t' read -r created_epoch tag <<< "${nightlies[$index]}"
            if (( index < 3 || created_epoch >= cutoff )); then
              continue
            fi
            echo "Deleting expired nightly release and tag: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
