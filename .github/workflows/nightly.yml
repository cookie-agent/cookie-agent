name: Nightly

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: Build nightly (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      COOKIE_GIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88.0'
          targets: ${{ matrix.target }}
      - name: Install musl build tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p cookie_agent --bin cookie --target "${{ matrix.target }}"
          archive="cookie_agent-${{ matrix.target }}.tar.xz"
          mkdir package
          cp "target/${{ matrix.target }}/release/cookie" package/cookie
          cp LICENSE README.md package/
          tar -C package -cJf "$archive" cookie LICENSE README.md
      - name: Upload nightly archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-${{ matrix.target }}
          retention-days: 2
          path: |
            cookie_agent-${{ matrix.target }}.tar.xz

  release:
    name: Update rolling nightly release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download nightly artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nightly-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          for archive in *.tar.xz; do
            sha256sum "$archive" > "$archive.sha256"
          done
          sha256sum *.tar.xz > sha256.sum
      - name: Update nightly prerelease in place
        shell: bash
        run: |
          set -euo pipefail
          title="Nightly ${GITHUB_SHA::12}"
          notes="Rolling build from commit $GITHUB_SHA. These artifacts are replaced after each successful push to main."
          release_json="$RUNNER_TEMP/nightly-release.json"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" > "$release_json" 2>/dev/null; then
            if [[ "$(jq -r '.prerelease' "$release_json")" != "true" ]]; then
              echo "Refusing to replace a non-prerelease release tagged nightly" >&2
              exit 1
            fi

            gh release upload nightly artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
              echo "Refusing to reuse an existing nightly tag without a managed prerelease" >&2
              exit 1
            fi
            gh release create nightly artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
