name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  check:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install --requirement requirements-docs.txt
      - run: ./scripts/build-docs.sh
        env:
          RUSTDOCFLAGS: -D warnings

  deploy:
    name: Package docs
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install --requirement requirements-docs.txt
      - run: ./scripts/build-docs.sh
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Configure deployment identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Fetch existing version tree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin +refs/heads/gh-pages:refs/heads/gh-pages
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              exit "$status"
            fi
          fi
      - name: Deploy development docs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          deploy_dev() {
            mike deploy --push dev || return
            if ! git cat-file -e gh-pages:index.html 2>/dev/null; then
              mike set-default --push dev
            fi
          }
          if ! deploy_dev; then
            git fetch origin +refs/heads/gh-pages:refs/heads/gh-pages
            deploy_dev
          fi
      - name: Deploy release docs
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          deploy_release() {
            mike deploy --alias-type=redirect --push --update-aliases "$RELEASE_TAG" latest &&
              mike set-default --push latest
          }
          if ! deploy_release; then
            git fetch origin +refs/heads/gh-pages:refs/heads/gh-pages
            deploy_release
          fi
      - name: Materialize versioned site
        run: |
          rm -rf _site_deploy
          mkdir _site_deploy
          git archive gh-pages | tar -x -C _site_deploy
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site_deploy

  publish:
    name: Publish docs
    if: github.event_name != 'pull_request'
    needs: deploy
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
