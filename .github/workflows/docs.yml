name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install --requirement requirements-docs.txt
      - run: ./scripts/build-docs.sh
        env:
          RUSTDOCFLAGS: -D warnings

  deploy:
    name: Publish docs to cookie-agent/doc
    if: (github.event_name == 'release' && !github.event.release.prerelease) || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: check
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install --requirement requirements-docs.txt
      - run: ./scripts/build-docs.sh
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Configure deployment identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add docs https://github.com/cookie-agent/doc.git
          # Fine-grained PAT: only cookie-agent/doc, Contents read/write.
          # The source repository's GITHUB_TOKEN cannot publish across repos.
          git config credential.https://github.com.helper '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$DOCS_DEPLOY_TOKEN"; fi; }; f'
      - name: Fetch existing version tree
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          : "${DOCS_DEPLOY_TOKEN:?Configure DOCS_DEPLOY_TOKEN with Contents write access to cookie-agent/doc}"
          git fetch docs +refs/heads/gh-pages:refs/heads/gh-pages
      - name: Deploy development docs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          deploy_dev() {
            git fetch origin main || return
            if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
              echo "Skipping development docs for superseded commit $GITHUB_SHA"
              return 0
            fi
            mike deploy --remote docs --push dev || return
            if ! git cat-file -e gh-pages:index.html 2>/dev/null; then
              mike set-default --remote docs --push dev
            fi
          }
          if ! deploy_dev; then
            git fetch docs +refs/heads/gh-pages:refs/heads/gh-pages
            deploy_dev
          fi
      - name: Deploy release docs
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          deploy_release() {
            # Retain every stable version, but never move latest backward.
            local versions newest
            versions="$(mike list --remote docs --json)" || return
            newest="$( { jq -r '.[].version' <<< "$versions"; echo "$RELEASE_TAG"; } |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)" || return
            if [[ "$newest" == "$RELEASE_TAG" ]]; then
              mike deploy --remote docs --alias-type=redirect --push --update-aliases "$RELEASE_TAG" latest &&
                mike set-default --remote docs --push latest
            else
              mike deploy --remote docs --push "$RELEASE_TAG"
            fi
          }
          if ! deploy_release; then
            git fetch docs +refs/heads/gh-pages:refs/heads/gh-pages
            deploy_release
          fi
