[advisories]
yanked = "deny"
# syntect 5.3.0 requires bincode 1.3.3 to decode its published syntax/theme
# dumps and lazy parsing contexts. RUSTSEC-2025-0141 is an unmaintained notice
# with no safe upgrade, not a vulnerability advisory.
# serde_yaml 0.9 (agent and skill front matter) requires unsafe-libyaml;
# RUSTSEC-2024-0449 is likewise an unmaintained notice until the config crate
# moves to another YAML parser.
# Leptos (the web client, crates/web) requires paste 1.0; RUSTSEC-2024-0436 is
# an unmaintained notice for a macro-only crate with no safe upgrade.
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2024-0449", "RUSTSEC-2024-0436"]

[bans]
multiple-versions = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MIT without the attribution clause; OSI-approved.
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# base16 (through Leptos's wasm_split_macros, in the web client) is dedicated
# to the public domain under CC0-1.0; allowed for that crate only.
[[licenses.exceptions]]
crate = "base16"
allow = ["CC0-1.0"]

# Our own unpublished crates use the Cookie Agent License (see LICENSE);
# dependencies still need an allowed license.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Cargo.toml and release-integrity tests pin every oven crate to 0f88e8a386aa3438fd38d521e5f816ab61dae195.
allow-git = ["https://github.com/cookie-agent/oven-sdk.git"]
