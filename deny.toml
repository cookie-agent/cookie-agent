[advisories]
yanked = "deny"
# Vendored syntect 5.3.0 requires bincode 1.3.3 to decode its published
# syntax/theme dumps and lazy parsing contexts. RUSTSEC-2025-0141 is an
# unmaintained notice with no safe upgrade, not a vulnerability advisory.
ignore = ["RUSTSEC-2025-0141"]

[bans]
multiple-versions = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # MIT without the attribution clause; OSI-approved.
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Cargo.toml and release-integrity tests pin every oven crate to db23b9c.
allow-git = ["https://github.com/cookie-agent/oven-sdk.git"]
