[package]
name = "cookie_agent_tui"
version = "0.2.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
cookie_agent_protocol = { version = "=0.2.0", path = "../protocol" }
cookie_agent_server = { version = "=0.2.0", path = "../server" }
crossterm.workspace = true
futures-util.workspace = true
foldhash.workspace = true
jiff.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation = "1.12"
unicode-width = "0.2"
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
cookie_agent_config = { version = "=0.2.0", path = "../config" }
