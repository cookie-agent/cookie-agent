[package]
name = "cookie_agent_engine_store"
version = "0.4.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
# Test hooks and helpers the engine's own tests reach. Never enabled by a
# shipped binary: only dev-dependencies turn it on.
test-support = []

[lints]
workspace = true

[dependencies]
base64 = "0.22"
cookie_agent_config = { version = "=0.4.0", path = "../config" }
cookie_agent_identity = { version = "=0.4.0", path = "../identity" }
cookie_agent_models = { version = "=0.4.0", path = "../models" }
cookie_agent_protocol = { version = "=0.4.0", path = "../protocol" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
cookie_agent_protocol = { version = "=0.4.0", path = "../protocol", features = ["test-support"] }
cookie_agent_models = { version = "=0.4.0", path = "../models", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
