[package]
name = "cookie_agent_plugin_sdk"
version = "0.2.0"
description = "Rust SDK for building cookie agent plugins"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://cookie-agent.github.io/cookie-agent/"

[lints]
workspace = true

[dependencies]
cookie_agent_protocol = { version = "=0.2.0", path = "../protocol" }
jsonschema = { version = "0.49.9", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
