[package]
name = "cookie_agent_engine"
version = "0.2.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[lints]
workspace = true

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
base64 = "0.22"
bytes.workspace = true
cookie_agent_config = { version = "=0.2.0", path = "../config" }
cookie_agent_identity = { version = "=0.2.0", path = "../identity" }
cookie_agent_models = { version = "=0.2.0", path = "../models" }
cookie_agent_protocol = { version = "=0.2.0", path = "../protocol" }
crc32fast.workspace = true
fs2.workspace = true
futures-util.workspace = true
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
indexmap.workspace = true
jiff.workspace = true
jsonschema = { version = "0.49.9", default-features = false }
lopdf = { version = "0.44.0", default-features = false }
oven-sdk.workspace = true
oven-sdk-azure.workspace = true
oven-sdk-openai.workspace = true
http.workspace = true
process-wrap.workspace = true
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
uuid.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[dev-dependencies]
cookie_agent_models = { version = "=0.2.0", path = "../models", features = ["test-support"] }
flate2.workspace = true
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
