[package]
name = "cookie_agent_runtime_api"
version = "0.4.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
# Helpers that run prepared tools outside the engine in tests.
test-support = []

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
cookie_agent_identity = { version = "=0.4.0", path = "../identity" }
cookie_agent_protocol = { version = "=0.4.0", path = "../protocol" }
crc32fast.workspace = true
futures-util.workspace = true
getrandom.workspace = true
memchr = "2.8.3"
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
similar = { version = "2.7.0", default-features = false }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
