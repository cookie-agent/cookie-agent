[package]
name = "cookie_agent_web"
version = "0.4.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
cookie_agent_client_state = { version = "=0.4.0", path = "../client_state" }
cookie_agent_protocol = { version = "=0.4.0", path = "../protocol" }
cookie_agent_protocol_transport = { version = "=0.4.0", path = "../protocol_transport", features = ["websocket"] }
foldhash.workspace = true
futures-util.workspace = true
gloo-timers = { version = "0.3.0", features = ["futures"] }
icondata.workspace = true
jiff.workspace = true
js-sys = "0.3.80"
leptos = { version = "0.8.22", features = ["csr"] }
leptos_icons.workspace = true
pulldown-cmark.workspace = true
serde_json.workspace = true
# The version leptos already compiles into the page; `[workspace.dependencies]`
# holds the one native crates use.
toml = "1.1.8"
url.workspace = true
uuid.workspace = true
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "AddEventListenerOptions",
    "DomRect",
    "Blob",
    "BlobPropertyBag",
    "BroadcastChannel",
    "CanvasRenderingContext2d",
    "Clipboard",
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "DocumentFragment",
    "DragEvent",
    "DomTokenList",
    "Document",
    "CssStyleDeclaration",
    "Element",
    "File",
    "FileList",
    "History",
    "HtmlCanvasElement",
    "HtmlDocument",
    "HtmlElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlTemplateElement",
    "HtmlTextAreaElement",
    "HtmlVideoElement",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "Navigator",
    "NodeList",
    "PopStateEvent",
    "ResizeObserver",
    "RegistrationOptions",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Selection",
    "ServiceWorkerContainer",
    "ServiceWorkerUpdateViaCache",
    "Storage",
    "StorageEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Url",
    "VisualViewport",
    "VisibilityState",
    "WheelEvent",
    "Response",
    "Window",
] }

[dev-dependencies]
crc32fast.workspace = true
cookie_agent_client_state = { version = "=0.4.0", path = "../client_state", features = ["test-support"] }
