[package]
name = "cookie_agent"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cookie"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["tui"]
tui = ["dep:cookie_agent_tui"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
cookie_agent_config = { version = "=0.1.0", path = "../config" }
cookie_agent_engine = { version = "=0.1.0", path = "../engine" }
cookie_agent_models = { version = "=0.1.0", path = "../models" }
cookie_agent_protocol = { version = "=0.1.0", path = "../protocol" }
cookie_agent_server = { version = "=0.1.0", path = "../server" }
cookie_agent_tools = { version = "=0.1.0", path = "../tools" }
cookie_agent_tui = { version = "=0.1.0", path = "../tui", optional = true }
futures-util.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
