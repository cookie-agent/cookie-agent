[package]
name = "cookie_agent_tools"
version = "0.2.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
cookie_agent_engine = { version = "=0.2.0", path = "../engine" }
cookie_agent_config = { version = "=0.2.0", path = "../config" }
cookie_agent_protocol = { version = "=0.2.0", path = "../protocol" }
process-wrap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
cookie_agent_engine = { version = "=0.2.0", path = "../engine", features = ["test-support"] }
cookie_agent_models = { version = "=0.2.0", path = "../models" }
tempfile.workspace = true
