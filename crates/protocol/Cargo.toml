[package]
name = "cookie_agent_protocol"
version = "0.4.0"
description = "Protocol wire types for Cookie Agent"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
homepage = "https://cookie-agent.github.io/cookie-agent/"

[features]
test-support = []
# Client-side loopback listener for MCP OAuth redirects (native only).
oauth-callback = []

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
cookie_agent_identity = { version = "=0.4.0", path = "../identity" }
crc32fast.workspace = true
jiff.workspace = true
oven-sdk.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_path_to_error.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# On wasm32 the crate is the wire types: tokio only for the in-process
# frame pair's channels, the browser for randomness and the clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { workspace = true, features = ["js"] }
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
insta.workspace = true
# Checks the hand-written control-character table against Unicode's.
regex = "1"
tempfile.workspace = true
# Paused time, for the peer's liveness tests.
tokio = { workspace = true, features = ["test-util"] }
