[package]
name = "cookie_agent_protocol"
version = "0.3.0"
description = "Protocol types and transports for cookie agent"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://cookie-agent.github.io/cookie-agent/"

[features]
test-support = []
# Client-side WebSocket transport for reaching a cookie daemon.
websocket = ["dep:futures-util", "dep:tokio-tungstenite", "dep:url"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
cookie_agent_identity = { version = "=0.3.0", path = "../identity" }
futures-util = { workspace = true, optional = true }
jiff.workspace = true
oven-sdk.workspace = true
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
insta.workspace = true
