# cookie-agent workspace configuration — explicit registry-free Oven models.
# Environment variables never become config fields. The COOKIE_TEST_API_KEY
# credential below is read only through explicit ${env:...} interpolation.
# Load the gitignored .env before launching:
#   set -a; source .env; set +a
#   cargo run -p cookie_agent

schema_version = 5

[server]
host = "127.0.0.1"
port = 17419

# In every model declaration, provider_id is the caller-defined stable serving
# identity used in descriptors/scopes/fingerprints. adaptor selects the
# concrete Oven adapter and wire protocol; the two names need not match.
[models.anthropic_live]
provider_id = "anthropic"
model_id = "kimi-for-coding"
endpoint = "https://llm-api.quantumcookie.xyz/v1"
adaptor = "anthropic"

[models.anthropic_live.auth]
type = "api_key"
value = "${env:COOKIE_TEST_API_KEY}"

[models.anthropic_live.capabilities]
features = ["tool_calling", "parallel_tools", "tool_input_deltas", "reasoning", "max_output_tokens", "prompt_caching", "usage"]
cancellation = "local_only"
compaction = "unsupported"

[models.anthropic_live.capabilities.limits]
context = 262144
output = 32768

[models.anthropic_live.capabilities.modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[models.anthropic_live.capabilities.media]

[models.anthropic_live.capabilities.media.input.image]
media_types = ["image/jpeg", "image/png", "image/gif", "image/webp"]
sources = ["inline_bytes"]

[models.anthropic_live.capabilities.media.input.pdf]
media_types = ["application/pdf"]
sources = ["inline_bytes"]

[models.anthropic_live.capabilities.replay]
policy = "if_valid"
capability = "optional"
reasoning = true

[models.anthropic_live.defaults]
max_output_tokens = 16384
reasoning_effort = "high"

[models.anthropic_live.settings]
thinking = "extended"
thinking_default_active = false
thinking_disable_allowed = true
thinking_disable_forbidden_efforts = []
effort = true
assistant_prefill = false
reject_non_default_sampling = false

[models.anthropic_live.options]
thinking = { type = "enabled", budget_tokens = 8192 }

[models.responses_live]
# Stable serving identity plus the official Responses adaptor discriminator.
provider_id = "openai"
model_id = "gpt-5.6-luna"
endpoint = "https://llm-api.quantumcookie.xyz/v1"
adaptor = "openai-responses"

[models.responses_live.auth]
type = "openai"
api_key = "${env:COOKIE_TEST_API_KEY}"

[models.responses_live.capabilities]
features = ["tool_calling", "parallel_tools", "tool_input_deltas", "reasoning", "structured_output", "max_output_tokens", "usage"]
cancellation = "local_only"
compaction = "native"

[models.responses_live.capabilities.limits]
context = 262144
output = 32768

[models.responses_live.capabilities.modalities]
input = ["text", "image", "pdf"]
output = ["text"]

[models.responses_live.capabilities.media]

[models.responses_live.capabilities.media.input.image]
media_types = ["image/*"]
sources = ["inline_bytes"]

[models.responses_live.capabilities.media.input.pdf]
media_types = ["application/pdf"]
sources = ["inline_bytes"]

[models.responses_live.capabilities.replay]
policy = "if_valid"
capability = "required"
reasoning = true

[models.responses_live.defaults]
max_output_tokens = 16384
reasoning_effort = "high"

[models.responses_live.settings]
compaction = "v1"

[models.responses_live.options]
parallel_tool_calls = true
reasoning_summary = "auto"

[models.chat_live]
# A caller-defined gateway identity intentionally differs from its adaptor.
provider_id = "quantumcookie.gateway"
model_id = "deepseek-v4-flash"
endpoint = "https://llm-api.quantumcookie.xyz/v1"
adaptor = "openai-compatible"

[models.chat_live.auth]
type = "bearer"
token = "${env:COOKIE_TEST_API_KEY}"

[models.chat_live.capabilities]
features = ["tool_calling", "max_output_tokens"]
cancellation = "local_only"
compaction = "unsupported"

[models.chat_live.capabilities.limits]
context = 262144
output = 32768

[models.chat_live.capabilities.modalities]
input = ["text"]
output = ["text"]

[models.chat_live.capabilities.media]
input = {}

[models.chat_live.capabilities.replay]
policy = "never"
capability = "unsupported"
reasoning = false

[models.chat_live.defaults]
max_output_tokens = 16384

[models.chat_live.settings]
adapter_id = "cookie.quantumcookie.openai-compatible.chat"
system_message_role = "developer"
max_tokens_field = "max_completion_tokens"
stream_usage = false
structured_output = "unsupported"
reasoning_field = "none"
strict_sse_content_type = false

# Empty internal model chains inherit the owning run's frozen model chain.
[internal_agents.approval]
models = []
max_input_tokens = 16384
max_output_tokens = 2048
timeout_ms = 30000

[internal_agents.context_compaction]
soft_threshold_percent = 70
hard_threshold_percent = 85
target_percent = 50
max_summary_bytes = 262144
max_native_context_bytes = 2097152
persistence = "native_preferred"

[internal_agents.context_compaction.profile]
models = []
max_input_tokens = 16384
max_output_tokens = 2048
timeout_ms = 30000

[internal_agents.session_title.profile]
models = []
max_input_tokens = 4096
max_output_tokens = 128
timeout_ms = 10000

[internal_agents.session_title.policy]
max_chars = 80
max_input_messages = 4
generate_on_first_turn = true
fallback_to_input_excerpt = true

# Workspace rules append after user rules and permissions use last-match wins.
# Ordinary source reads remain allowed. Protected local-secret reads and all
# search/glob enumeration are denied by the final rules below so later
# workspace policy cannot weaken a user deny for those resources.
[[permissions.rules]]
id = "allow-workspace-read"
action = "read"
resource = "*"
effect = "allow"

[[permissions.rules]]
id = "allow-workspace-search"
action = "grep"
resource = "*"
effect = "allow"

[[permissions.rules]]
id = "allow-workspace-glob"
action = "glob"
resource = "*"
effect = "allow"

[[permissions.rules]]
id = "ask-write"
action = "write"
resource = "*"
effect = "ask"

[[permissions.rules]]
id = "ask-bash"
action = "bash"
resource = "*"
effect = "ask"

[[permissions.rules]]
id = "ask-delegate"
action = "delegate"
resource = "*"
effect = "ask"

[[permissions.rules]]
id = "ask-external-directory"
action = "external_directory"
resource = "*"
effect = "ask"

# Prepared read labels are canonical absolute paths. Keep the checked-in
# example readable, but deny root or nested environment and local secret files.
[[permissions.rules]]
id = "deny-read-dotenv"
action = "read"
resource = "*/.env"
effect = "deny"

[[permissions.rules]]
id = "deny-read-dotenv-variants"
action = "read"
resource = "*/.env.*"
effect = "deny"

[[permissions.rules]]
id = "allow-read-dotenv-example"
action = "read"
resource = "*/.env.example"
effect = "allow"

[[permissions.rules]]
id = "deny-read-credential-store"
action = "read"
resource = "*/store-v1.json"
effect = "deny"

[[permissions.rules]]
id = "deny-read-daemon-token"
action = "read"
resource = "*/token-v1"
effect = "deny"

[[permissions.rules]]
id = "deny-read-json-credentials"
action = "read"
resource = "*/credentials.json"
effect = "deny"

[[permissions.rules]]
id = "deny-read-toml-credentials"
action = "read"
resource = "*/credentials.toml"
effect = "deny"

[[permissions.rules]]
id = "deny-read-yaml-credentials"
action = "read"
resource = "*/credentials.yaml"
effect = "deny"

[[permissions.rules]]
id = "deny-read-yml-credentials"
action = "read"
resource = "*/credentials.yml"
effect = "deny"

[[permissions.rules]]
id = "deny-read-json-secrets"
action = "read"
resource = "*/secrets.json"
effect = "deny"

[[permissions.rules]]
id = "deny-read-toml-secrets"
action = "read"
resource = "*/secrets.toml"
effect = "deny"

[[permissions.rules]]
id = "deny-read-yaml-secrets"
action = "read"
resource = "*/secrets.yaml"
effect = "deny"

[[permissions.rules]]
id = "deny-read-yml-secrets"
action = "read"
resource = "*/secrets.yml"
effect = "deny"

[[permissions.rules]]
id = "deny-read-token-file"
action = "read"
resource = "*/token"
effect = "deny"

[[permissions.rules]]
id = "deny-read-json-token"
action = "read"
resource = "*/token.json"
effect = "deny"

[[permissions.rules]]
id = "deny-read-text-token"
action = "read"
resource = "*/token.txt"
effect = "deny"

[[permissions.rules]]
id = "deny-read-netrc"
action = "read"
resource = "*/.netrc"
effect = "deny"

[[permissions.rules]]
id = "deny-read-npmrc"
action = "read"
resource = "*/.npmrc"
effect = "deny"

[[permissions.rules]]
id = "deny-read-pypirc"
action = "read"
resource = "*/.pypirc"
effect = "deny"

[[permissions.rules]]
id = "deny-read-aws-credentials"
action = "read"
resource = "*/.aws/credentials"
effect = "deny"

[[permissions.rules]]
id = "deny-read-gcloud-credentials"
action = "read"
resource = "*/application_default_credentials.json"
effect = "deny"

[[permissions.rules]]
id = "deny-read-rsa-private-key"
action = "read"
resource = "*/id_rsa"
effect = "deny"

[[permissions.rules]]
id = "deny-read-ed25519-private-key"
action = "read"
resource = "*/id_ed25519"
effect = "deny"

# Grep and glob manifests contain root/pattern labels rather than a complete
# per-file authorization surface, so deny these enumeration tools outright.
[[permissions.rules]]
id = "deny-workspace-search-enumeration"
action = "grep"
resource = "*"
effect = "deny"

[[permissions.rules]]
id = "deny-workspace-glob-enumeration"
action = "glob"
resource = "*"
effect = "deny"

[agents.primary]
type = "primary"
models = ["anthropic_live", "responses_live", "chat_live"]
tools = ["read", "grep", "glob", "write", "edit", "bash"]

[agents.primary.delegation]
enabled = true
allowed_profiles = ["worker"]
limit = 3

[agents.worker]
type = "subagent"
models = ["responses_live"]
tools = ["read", "grep", "glob"]

[agents.worker.delegation]
enabled = false

[agents.anthropic]
type = "primary"
models = ["anthropic_live"]
tools = ["read", "grep", "glob", "write", "edit", "bash"]

[agents.anthropic.delegation]
enabled = true
allowed_profiles = ["worker"]
limit = 3

[agents.responses]
type = "primary"
models = ["responses_live"]
tools = ["read", "grep", "glob", "write", "edit", "bash"]

[agents.responses.delegation]
enabled = true
allowed_profiles = ["worker"]
limit = 3

[agents.chat]
type = "primary"
models = ["chat_live"]
tools = ["read", "grep", "glob", "write", "edit", "bash"]

[agents.chat.delegation]
enabled = true
allowed_profiles = ["worker"]
limit = 3
